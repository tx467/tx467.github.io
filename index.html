<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #0a0a0a; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }

  /* Variation switcher (top-left) */
  .v-switcher {
    position: fixed; top: 14px; left: 14px; z-index: 1000;
    display: flex; gap: 4px;
    background: rgba(20,20,20,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; padding: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .v-switcher button {
    background: transparent; border: 0; color: rgba(255,255,255,0.55);
    padding: 6px 12px; border-radius: 999px; letter-spacing: 0.04em;
    transition: background .15s, color .15s;
  }
  .v-switcher button:hover { color: rgba(255,255,255,0.9); }
  .v-switcher button.active { background: rgba(255,255,255,0.12); color: #fff; }

  /* Mode toggle (top-right on each variation, absolute inside variation) */
  .mode-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(128,128,128,0.08);
    border-radius: 999px; padding: 3px; border: 1px solid currentColor;
    border-color: rgba(128,128,128,0.2);
  }
  .mode-toggle button {
    background: transparent; border: 0; padding: 5px 10px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.04em; color: inherit; opacity: 0.55;
    font-family: 'IBM Plex Mono', monospace;
  }
  .mode-toggle button.active { background: currentColor; opacity: 1; }
  .mode-toggle button.active span { filter: invert(1); mix-blend-mode: difference; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; bottom: 16px; right: 16px; z-index: 1000;
    width: 280px;
    background: rgba(18,18,18,0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    overflow: hidden;
  }
  .tweaks-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    letter-spacing: 0.1em; text-transform: uppercase; font-size: 10px;
    color: rgba(255,255,255,0.6);
  }
  .tweaks-body { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .tweak-row { display: flex; flex-direction: column; gap: 6px; }
  .tweak-row label { color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .tweak-row .choices { display: flex; gap: 4px; flex-wrap: wrap; }
  .tweak-row .choices button {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75); padding: 5px 9px; border-radius: 6px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.03em;
  }
  .tweak-row .choices button.active {
    background: rgba(255,255,255,0.95); color: #000; border-color: transparent;
  }
  .tweak-row .swatches { display: flex; gap: 6px; }
  .tweak-row .swatches button {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); padding: 0;
  }
  .tweak-row .swatches button.active { border-color: #fff; }
  .tweaks-close {
    background: transparent; border: 0; color: rgba(255,255,255,0.5);
    font-size: 14px; padding: 0; line-height: 1;
  }
  .tweaks-min {
    position: fixed; bottom: 16px; right: 16px; z-index: 1000;
    background: rgba(18,18,18,0.9); color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px; padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Theme reveal (View Transitions) */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }

// Typing effect hook
function useTyping(text, speed = 32, startDelay = 300) {
  const [shown, setShown] = React.useState('');
  const [done, setDone] = React.useState(false);
  React.useEffect(() => {
    setShown(''); setDone(false);
    let i = 0;
    const t0 = setTimeout(() => {
      const iv = setInterval(() => {
        i++;
        setShown(text.slice(0, i));
        if (i >= text.length) { clearInterval(iv); setDone(true); }
      }, speed);
    }, startDelay);
    return () => clearTimeout(t0);
  }, [text, speed, startDelay]);
  return [shown, done];
}

// Decode/scramble effect — text settles into place when `active` flips true
function useDecode(text, active) {
  const [out, setOut] = React.useState(text);
  React.useEffect(() => {
    if (!active) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setOut(text); return; }
    const chars = '#$%&@*+=<>/{}[]';
    let frame = 0; const total = 16;
    setOut(text.split('').map(c => c === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)]).join(''));
    const iv = setInterval(() => {
      frame++;
      const reveal = Math.floor((frame / total) * text.length);
      setOut(text.split('').map((c, i) =>
        (i < reveal || c === ' ') ? c : chars[Math.floor(Math.random() * chars.length)]
      ).join(''));
      if (frame >= total) { setOut(text); clearInterval(iv); }
    }, 42);
    return () => clearInterval(iv);
  }, [active, text]);
  return out;
}

// Obfuscated email — rot13 + reverse, assembled at click; not rendered as plain text
function deobf(s) {
  // s is stored rot13-reversed
  const rev = s.split('').reverse().join('');
  return rev.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
  });
}
function obf(s) {
  const r13 = s.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
  });
  return r13.split('').reverse().join('');
}

// Drifting constellation background (motion-gated)
function Constellation({ color, opacity = 0.5 }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, raf;
    const resize = () => {
      w = canvas.width = canvas.offsetWidth;
      h = canvas.height = canvas.offsetHeight;
    };
    resize();
    window.addEventListener('resize', resize);
    const N = 44;
    const pts = Array.from({ length: N }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22
    }));
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1;
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      for (let i = 0; i < N; i++) {
        const a = pts[i];
        ctx.globalAlpha = 0.45;
        ctx.beginPath(); ctx.arc(a.x, a.y, 1.3, 0, 7); ctx.fill();
        for (let j = i + 1; j < N; j++) {
          const b = pts[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 130) {
            ctx.globalAlpha = (1 - d / 130) * 0.22;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [color]);
  return (
    <canvas ref={ref} style={{
      position: 'fixed', inset: 0, width: '100%', height: '100%',
      zIndex: 0, pointerEvents: 'none', opacity
    }}/>
  );
}

function FilterPills({ label, values, active, onChange, accentCol, fg, muted, border }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
      <span style={{ color: muted, letterSpacing: '0.08em', textTransform: 'uppercase' }}>{label}:</span>
      <div style={{ display: 'flex', gap: '3px' }}>
        {values.map(v => {
          const act = String(active) === String(v);
          return (
            <button key={v} onClick={() => onChange(v)}
              style={{
                background: act ? accentCol : 'transparent',
                color: act ? '#fff' : fg,
                opacity: act ? 1 : 0.55,
                border: `1px solid ${act ? accentCol : border}`,
                padding: '3px 8px', borderRadius: '3px',
                fontFamily: 'inherit', fontSize: '10.5px',
                letterSpacing: '0.04em', textTransform: v === 'all' ? 'uppercase' : 'none',
                cursor: 'pointer'
              }}
            >{v === 'all' ? 'All' : v}</button>
          );
        })}
      </div>
    </div>
  );
}

function MinimalVariant({ accent, fontPair, density, mode }) {
  const isDark = mode === 'dark';
  const fp = FONT_PAIRS[fontPair];
  const ac = ACCENTS[accent];
  const dens = DENSITY[density];

  const bg = isDark ? '#0d0d0d' : '#fafafa';
  const fg = isDark ? '#f2f2f2' : '#0d0d0d';
  const muted = isDark ? 'rgba(242,242,242,0.5)' : 'rgba(13,13,13,0.5)';
  const faint = isDark ? 'rgba(242,242,242,0.08)' : 'rgba(13,13,13,0.08)';
  const accentCol = isDark ? ac.dark : ac.light;

  const sans = `'${fp.sans}', system-ui, sans-serif`;
  const mono = `'${fp.mono}', monospace`;

  const [tagline, typingDone] = useTyping(DATA.tagline, 20, 500);
  const [expandedPub, setExpandedPub] = React.useState(null);
  const [pubFilter, setPubFilter] = React.useState({ year: 'all', topic: 'all' });
  const [activeSection, setActiveSection] = React.useState('intro');

  const scrollerRef = React.useRef(null);
  React.useEffect(() => {
    const root = scrollerRef.current;
    if (!root) return;
    const handler = () => {
      const sections = root.querySelectorAll('section[id]');
      let current = 'intro';
      sections.forEach(s => {
        const top = s.getBoundingClientRect().top;
        if (top < 180) current = s.id;
      });
      setActiveSection(current);
    };
    root.addEventListener('scroll', handler);
    return () => root.removeEventListener('scroll', handler);
  }, []);

  const scrollTo = (id) => {
    const el = scrollerRef.current?.querySelector(`#${id}`);
    if (el && scrollerRef.current) {
      scrollerRef.current.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
    }

  const topics = ['all', ...new Set(DATA.publications.map(p => p.topic))];

    (pubFilter.year === 'all' || p.year === +pubFilter.year) &&

          <span style={{ fontWeight: 500 }}>xin-teng.cs</span>

        <div style={{ display: 'flex', gap: '14px' }}>

              <p style={{
                fontFamily: sans, fontSize: `${24 * dens.scale}px`, lineHeight: 1.4,
                fontWeight: 300, margin: '0 0 24px', letterSpacing: '-0.015em', maxWidth: '24ch',

                </a>

                marginTop: gapBase * 2,
                paddingTop: gapBase,
                borderTop: `1px solid ${faint}`,
                fontFamily: mono, fontSize: '11px', color: muted,
                display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '10px'
              }}>
                <span>© {new Date().getFullYear()} {DATA.name}</span>
                <span>Updated APR 2026 · built from scratch, no frameworks.</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}

function chipStyle(color, bg, mono) {
  return {
    display: 'inline-flex', alignItems: 'center', gap: '8px',
    padding: '7px 12px', borderRadius: '999px',
    background: bg, color,
    fontFamily: mono, fontSize: '11.5px', letterSpacing: '0.02em',
    textDecoration: 'none',
    border: bg.startsWith('rgba') || bg.startsWith('#') && bg.length > 4 ? `1px solid ${bg}` : 'none'
  };
}

function MinimalFilter({ label, values, active, onChange, accentCol, muted, fg }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
      <span style={{ color: muted, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{label}</span>
      {values.map(v => (
        <button key={v} onClick={() => onChange(v)}
          style={{
            background: 'transparent', border: 0,
            color: String(active) === String(v) ? accentCol : fg,
            opacity: String(active) === String(v) ? 1 : 0.5,
            fontFamily: 'inherit', fontSize: 'inherit',
            padding: '2px 4px', cursor: 'pointer',
            textDecoration: String(active) === String(v) ? 'underline' : 'none',
            textUnderlineOffset: '4px'
          }}
        >{v === 'all' ? 'all' : v}</button>
      ))}
    </div>
  );
}

Object.assign(window, { MinimalVariant });

// Variation 3: Playful / Colorful
// Soft pastel color-blocks, rounded cards, gentle gradients, refined not chaotic.
// One hero color-block, tinted section backgrounds, sticker-style chips.

function PlayfulVariant({ accent, fontPair, density, mode }) {
  const isDark = mode === 'dark';
  const fp = FONT_PAIRS[fontPair];
  const ac = ACCENTS[accent];
  const dens = DENSITY[density];

  // Soft palette — derived from accent + complementary pastels
  const palette = isDark
    ? {
        bg: '#12100f',
        fg: '#f4eee4',
        muted: 'rgba(244,238,228,0.6)',
        cream: '#1f1b16',         // soft panel
        mint:  '#1a2420',
        sky:   '#192027',
        peach: '#241a18',
        border: 'rgba(244,238,228,0.1)'
      }
    : {
        bg: '#fdf8f0',
        fg: '#2a241e',
        muted: 'rgba(42,36,30,0.58)',
        cream: '#fff3df',
        mint:  '#dcefe0',
        sky:   '#dde8f2',
        peach: '#f8dccb',
        border: 'rgba(42,36,30,0.12)'
      };
  const accentCol = isDark ? ac.dark : ac.light;

  const serif = `'${fp.serif}', Georgia, serif`;
  const sans = `'${fp.sans}', system-ui, sans-serif`;
  const mono = `'${fp.mono}', monospace`;

  const [tagline, typingDone] = useTyping(DATA.tagline, 22, 500);
  const [expandedPub, setExpandedPub] = React.useState(null);
  const [pubFilter, setPubFilter] = React.useState({ year: 'all', topic: 'all' });
  const [activeSection, setActiveSection] = React.useState('hero');

  const scrollerRef = React.useRef(null);
  React.useEffect(() => {
    const root = scrollerRef.current;
    if (!root) return;
    const handler = () => {
      const sections = root.querySelectorAll('section[id]');
      let current = 'hero';
      sections.forEach(s => {
        if (s.getBoundingClientRect().top < 180) current = s.id;
      });
      setActiveSection(current);
    };
    root.addEventListener('scroll', handler);
    return () => root.removeEventListener('scroll', handler);
  }, []);

  const scrollTo = (id) => {
    const el = scrollerRef.current?.querySelector(`#${id}`);
    if (el && scrollerRef.current) {
      scrollerRef.current.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
    }
  };

  const years = ['all', ...new Set(DATA.publications.map(p => p.year))];
  const topics = ['all', ...new Set(DATA.publications.map(p => p.topic))];
  const filteredPubs = DATA.publications.filter(p =>
    (pubFilter.year === 'all' || p.year === +pubFilter.year) &&
    (pubFilter.topic === 'all' || p.topic === pubFilter.topic)

  const padBase = 36 * dens.pad;
  const gapBase = 24 * dens.gap;
  const topicColor = { ML: palette.sky, HCI: palette.peach, Systems: palette.mint };

  const navItems = [
    ['hero', 'Hello'],
    ['about', 'About'],
    ['news', 'News'],

    ['experience', 'CV'],

    <div

        background: palette.bg, color: palette.fg, height: '100vh', overflowY: 'auto',
        fontFamily: sans, fontSize: `${15.5 * dens.scale}px`,
        transition: 'background 0.3s, color 0.3s'
      }}>

      {/* Sticky nav pill — positioned below variation switcher & mode toggle */}

        position: 'sticky', top: 64, zIndex: 20, pointerEvents: 'none',
        display: 'flex', justifyContent: 'center', marginBottom: '-48px'
      }}>

          pointerEvents: 'auto',
          display: 'flex', gap: '2px', padding: '5px',
          background: isDark ? 'rgba(30,26,22,0.8)' : 'rgba(255,255,255,0.85)',
          backdropFilter: 'blur(14px)',
          border: `1px solid ${palette.border}`,
          borderRadius: '999px',
          fontFamily: sans, fontSize: '13px',
          flexWrap: 'wrap', maxWidth: '90%', justifyContent: 'center',
          boxShadow: isDark ? '0 8px 24px rgba(0,0,0,0.4)' : '0 8px 24px rgba(42,36,30,0.08)'
        }}>
          {navItems.map(([id, l]) => (
            <button key={id} onClick={() => scrollTo(id)}
              style={{
                background: activeSection === id ? accentCol : 'transparent',
                color: activeSection === id ? (isDark ? '#000' : '#fff') : palette.fg,
                border: 0, padding: '7px 14px', borderRadius: '999px',
                fontFamily: 'inherit', fontSize: 'inherit',

      </div>

      {/* HERO — big color block */}

// Tweaks panel + variation switcher

function VariationSwitcher({ variant, setVariant }) {
  return (
    <div className="v-switcher">

        ['academic', '01 · Academic'],

}

function ModeToggle({ mode, setMode, accent }) {
  const ac = ACCENTS[accent];
  return (
    <div style={{
      position: 'fixed', top: 14, right: 14, zIndex: 1000,
      display: 'flex', gap: 4,
      background: mode === 'dark' ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)',
      backdropFilter: 'blur(12px)',
      border: `1px solid ${mode === 'dark' ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'}`,
      borderRadius: 999, padding: 4,
      fontFamily: 'IBM Plex Mono, monospace', fontSize: 11,
      color: mode === 'dark' ? '#fff' : '#000'
    }}>
      {['light', 'dark'].map(m => (
        <button key={m} onClick={(e) => setMode(m, e)}
          title={m === 'light' ? 'Light mode' : 'Dark mode'}
          style={{
            background: mode === m ? (m === 'dark' ? '#fff' : '#000') : 'transparent',
            color: mode === m ? (m === 'dark' ? '#000' : '#fff') : 'inherit',
            border: 0, padding: '4px 9px', borderRadius: 999,
            fontSize: 13, lineHeight: 1, fontFamily: 'inherit',
            cursor: 'pointer', minWidth: '28px'
          }}>{m === 'light' ? '☀' : '☾'}</button>
      ))}
    </div>
  );
}

function TweaksPanel({ state, setState, active, setActive }) {
  const [open, setOpen] = React.useState(true);

  if (!active) return null;
  if (!open) {
    return (
      <button className="tweaks-min" onClick={() => setOpen(true)}>
        ⚙ TWEAKS
      </button>
    );
  }

  const update = (key, value) => {
    const next = { ...state, [key]: value };
    setState(next);
    // persist to source
    window.parent.postMessage({
      type: '__edit_mode_set_keys',
      edits: { [key]: value }
    }, '*');
  };

  return (
    <div className="tweaks">
      <div className="tweaks-header">
        <span>Tweaks</span>
        <button className="tweaks-close" onClick={() => setOpen(false)}>×</button>
      </div>
      <div className="tweaks-body">
        {/* Accent */}
        <div className="tweak-row">
          <label>Accent</label>
          <div className="swatches">
            {Object.entries(ACCENTS).map(([k, v]) => (
              <button key={k}
                className={state.accent === k ? 'active' : ''}
                onClick={() => update('accent', k)}
                style={{ background: v.light }}
                title={v.label}/>
            ))}
          </div>
        </div>

        {/* Font pairing */}
        <div className="tweak-row">
          <label>Font pairing</label>
          <div className="choices">
            {Object.entries(FONT_PAIRS).map(([k, v]) => (
              <button key={k}
                className={state.fontPair === k ? 'active' : ''}
                onClick={() => update('fontPair', k)}>
                {v.serif.split(' ')[0]} / {v.sans.split(' ')[0]}
              </button>
            ))}
          </div>
        </div>

        {/* Density */}
        <div className="tweak-row">
          <label>Density</label>
          <div className="choices">
            {['compact', 'comfortable', 'spacious'].map(d => (
              <button key={d}
                className={state.density === d ? 'active' : ''}
                onClick={() => update('density', d)}>{d}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// Main app — composes variations, handles tweaks + edit-mode messaging

function App() {
  const defaults = JSON.parse(
    document.getElementById('tweak-defaults').textContent
      .replace('/*EDITMODE-BEGIN*/', '').replace('/*EDITMODE-END*/', '')
  );

  // Load from localStorage where possible, otherwise defaults
  const load = () => {
    try {
      const saved = JSON.parse(localStorage.getItem('xt-homepage-v2') || '{}');
      return { ...defaults, ...saved };
    } catch { return defaults; }
  };

  const [state, setStateRaw] = React.useState(load);
  const setState = (next) => {
    setStateRaw(next);
    try { localStorage.setItem('xt-homepage-v2', JSON.stringify(next)); } catch {}
  };

  const [editMode, setEditMode] = React.useState(false);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      else if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setVariant = (v) => setState({ ...state, variant: v });
  const setMode = (m, ev) => {
    if (m === state.mode) return;
    const apply = () => setState({ ...state, mode: m });
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (document.startViewTransition && !reduced && ev) {
      const x = ev.clientX, y = ev.clientY;
      const r = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );
      const vt = document.startViewTransition(() => {
        ReactDOM.flushSync(apply);
      });
      vt.ready.then(() => {
        document.documentElement.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
          { duration: 550, easing: 'cubic-bezier(.2,.6,.2,1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(() => {});
    } else {
      apply();
    }
  };

  const commonProps = {
    accent: state.accent, fontPair: state.fontPair,
    density: state.density, mode: state.mode
  };

  let Variant = AcademicVariant; // settled on the Academic design

  return (
    <>
      <Variant key={state.variant + state.mode} {...commonProps}/>
      <ModeToggle mode={state.mode} setMode={setMode} accent={state.accent}/>
      <TweaksPanel state={state} setState={setState} active={editMode}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
